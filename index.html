<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Taller de Javascript</title>
  </head>
  <body>
    <form class="formulario" id="formulario" action="">
      <h1 id="title-formulario">Contacto</h1>
      <div class="contenedor1">
        <input
          type="text"
          placeholder="Nombre y apellido"
          id="nombre"
          name="nombre"
        />
      </div>
      <div class="contenedor2">
        <input
          type="text"
          placeholder="Apellido"
          id="apellido"
          name="apellido"
        />
      </div>
      <div class="contenedor3">
        <input
          type="email"
          placeholder="Correo Electrónico"
          id="email"
          name="email"
        />
      </div>
      <div class="contenerdor5">
        <input
          name="mensaje"
          id="mensaje"
          type="text"
          placeholder="Escribe tu mensaje aquí..."
        ></input>
      </div>
      <div class="buttons">
        <button type="button" id="resetBtn">Resetear</button>
        <button type="submit" id="enviar">Enviar</button>
      </div>
    </form>

    <div class="contenedor4" id="div-contenedor4">
      <h2 class="titulo-contenedor4">Titulo</h2>
      <div class="parrafos">
        <p class="parrafo">Parrafo 1</p>
        <p class="parrafo">parrafo 2</p>
        <p class="parrafo">parrafo 3</p>
        <p class="parrafo4">parrafo 4</p>
        <button type="button" class="btnparrafo" id="btnparrafo">
          Ocultar Párrafo
        </button>
        <button type="button" class="btnparrafo" id="btnClickeame">
          ¡Clickeame!
        </button>
      </div>
    </div>

  </body>
</html>
