<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Taller de Javascript</title>
  </head>
  <body>
    <form class="formulario" id="formulario" action="">
      <h1>Contacto</h1>
      <div class="contenedor1">
        <input
          type="text"
          placeholder="Nombre y apellido"
          id="nombre"
          name="nombre"
        />
      </div>

      <div class="contenedor2">
        <input
          type="text"
          placeholder="Apellido"
          id="apellido"
          name="apellido"
        />
      </div>
      <div class="contenedor3">
        <input
          type="email"
          placeholder="Correo Electrónico"
          id="email"
          name="email"
        />
      </div>
      <div class="buttons">
          <button type="button" id="resetBtn">Resetear</button>
          <button type="submit" id="enviar">Enviar</button>
      </div>
    </form>

    <script src="scripts/script.js"></script>
    <script src="scripts/segundaclase.js"></script>
    <script src="scripts/Funciones.js"></script>
    <script src="scripts/tercerclase.js"></script>
    <script src="scripts/manipulacionDom.js"></script>
  </body>
</html>
